# PrusaSlicer 2.7 — QIDI Plus 4 + QIDI Box, bico 0.4, PLA, 3 cores
# Valores retirados dos perfis oficiais do QIDI Studio:
#   "X-Plus 4 0.4 nozzle", "0.20mm Standard @XPlus4", "QIDI PLA Basic @Qidi X-Plus 4 0.4 nozzle"
# A troca de filamento é escrita como marcador e expandida por scripts/fatiar.py
# com o G-code oficial da QIDI (corte, despejo no caixote, purga, limpeza do bico).

# ---------------- impressora
printer_technology = FFF
bed_shape = 0x0,305x0,305x305,0x305
max_print_height = 280
gcode_flavor = klipper
nozzle_diameter = 0.4,0.4,0.4
extruder_offset = 0x0,0x0,0x0
extruder_colour = #15171A;#C47A45;#F5F5F5
single_extruder_multi_material = 1
use_relative_e_distances = 1
use_firmware_retraction = 0
machine_limits_usage = time_estimate_only
machine_max_acceleration_x = 20000,20000
machine_max_acceleration_y = 20000,20000
machine_max_acceleration_extruding = 20000,20000
machine_max_acceleration_retracting = 5000,5000
machine_max_acceleration_travel = 20000,20000
machine_max_feedrate_x = 600,600
machine_max_feedrate_y = 600,600
machine_max_feedrate_z = 20,20
machine_max_feedrate_e = 50,50
autoemit_temperature_commands = 0
gcode_label_objects = octoprint
gcode_substitutions =
remaining_times = 0
thumbnails = 96x96/PNG, 272x272/PNG

retract_length = 0.8,0.8,0.8
retract_speed = 30,30,30
deretract_speed = 30,30,30
retract_lift = 0.4,0.4,0.4
retract_lift_below = 279,279,279
retract_before_travel = 1,1,1
retract_layer_change = 1,1,1
wipe = 1,1,1
retract_length_toolchange = 0,0,0
retract_restart_extra_toolchange = 0,0,0

start_gcode = PRINT_START BED=[first_layer_bed_temperature[initial_extruder]] HOTEND=[first_layer_temperature[initial_extruder]] CHAMBER=0 EXTRUDER=[initial_extruder]\nSET_PRINT_STATS_INFO TOTAL_LAYER=[total_layer_count]\nM83\nT[initial_tool]\nM140 S[first_layer_bed_temperature[initial_extruder]]\nM104 S[first_layer_temperature[initial_extruder]]\nM141 S0\nG4 P3000\nG0 X{max((min(print_bed_max[0] - 12, first_layer_print_min[0] + 80) - 85), 0)} Y{max((min(print_bed_max[1] - 3, first_layer_print_min[1] + 80) - 85), 0)} Z5 F6000\nG0 Z[first_layer_height] F600\nG1 E3 F1800\nG1 X{(min(print_bed_max[0] - 12, first_layer_print_min[0] + 80))} E{85 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000\nG1 Y{max((min(print_bed_max[1] - 3, first_layer_print_min[1] + 80) - 85), 0) + 2} E{2 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000\nG1 X{max((min(print_bed_max[0] - 12, first_layer_print_min[0] + 80) - 85), 0)} E{85 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000\nG1 Y{max((min(print_bed_max[1] - 3, first_layer_print_min[1] + 80) - 85), 0) + 85} E{83 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000\nG1 X{max((min(print_bed_max[0] - 12, first_layer_print_min[0] + 80) - 85), 0) + 2} E{2 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000\nG1 Y{max((min(print_bed_max[1] - 3, first_layer_print_min[1] + 80) - 85), 0) + 3} E{82 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000\nG1 X{max((min(print_bed_max[0] - 12, first_layer_print_min[0] + 80) - 85), 0) + 3} Z0\nG1 X{max((min(print_bed_max[0] - 12, first_layer_print_min[0] + 80) - 85), 0) + 6}\nG1 Z1 F600\nSET_PRINT_STATS_INFO CURRENT_LAYER=1
end_gcode = DISABLE_BOX_HEATER\nM141 S0\nM140 S0\nDISABLE_ALL_SENSOR\nG1 E-3 F1800\n{if max_layer_z + 3 > max_print_height}G0 Z{max_print_height} F600{else}G0 Z{max_layer_z + 3} F600{endif}\nUNLOAD_FILAMENT T=[current_extruder]\nG0 Y290 F12000\nG0 X90 Y290 F12000\n{if max_layer_z < max_print_height / 2}G1 Z{max_print_height / 2 + 10} F600{else}G1 Z{min(max_print_height, max_layer_z + 3)}{endif}\nM104 S0
layer_gcode = G92 E0\nSET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
before_layer_gcode =
toolchange_gcode = ; MAVI_TOOLCHANGE [previous_extruder] [next_extruder] {max_layer_z}
color_change_gcode = M600
pause_print_gcode = M0

# ---------------- filamento (QIDI PLA Basic) x3
filament_type = PLA;PLA;PLA
filament_colour = #15171A;#C47A45;#F5F5F5
filament_diameter = 1.75,1.75,1.75
filament_density = 1.24,1.24,1.24
extrusion_multiplier = 0.98,0.98,0.98
filament_max_volumetric_speed = 18,18,18
temperature = 210,210,210
first_layer_temperature = 210,210,210
bed_temperature = 60,60,60
first_layer_bed_temperature = 60,60,60
cooling = 1,1,1
fan_always_on = 1,1,1
min_fan_speed = 100,100,100
max_fan_speed = 100,100,100
bridge_fan_speed = 100,100,100
disable_fan_first_layers = 1,1,1
fan_below_layer_time = 60,60,60
slowdown_below_layer_time = 8,8,8
min_print_speed = 20,20,20
filament_ramming_parameters = ""
filament_cooling_moves = 0,0,0
filament_unloading_speed = 0,0,0
filament_loading_speed = 28,28,28
start_filament_gcode = "; Filament start gcode";"; Filament start gcode";"; Filament start gcode"
end_filament_gcode = "; Filament end gcode";"; Filament end gcode";"; Filament end gcode"

# ---------------- impressão (0.20mm Standard @XPlus4, ajustado)
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
top_fill_pattern = monotoniclines
bottom_fill_pattern = monotonic
solid_fill_pattern = rectilinear
fill_angle = 45
infill_overlap = 15%
perimeter_generator = arachne
# afinado por medição (cobertura do texto pequeno): ver README
min_feature_size = 10%
min_bead_width = 60%
thin_walls = 0
gap_fill_enabled = 1
seam_position = rear
external_perimeters_first = 0
only_one_perimeter_top = 0
ensure_vertical_shell_thickness = ensure_all
extrusion_width = 0.42
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.42
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.42
top_infill_extrusion_width = 0.42
skirts = 0
brim_width = 0
support_material = 0
wipe_tower = 0
ooze_prevention = 0
complete_objects = 0
avoid_crossing_perimeters = 1
avoid_crossing_perimeters_max_detour = 200%
interface_shells = 0

# velocidades (mm/s) e acelerações (mm/s2)
perimeter_speed = 200
external_perimeter_speed = 150
small_perimeter_speed = 50
infill_speed = 270
solid_infill_speed = 250
top_solid_infill_speed = 200
gap_fill_speed = 150
travel_speed = 500
travel_speed_z = 20
first_layer_speed = 50
first_layer_speed_over_raft = 50
bridge_speed = 50
default_acceleration = 10000
perimeter_acceleration = 5000
external_perimeter_acceleration = 3000
infill_acceleration = 10000
solid_infill_acceleration = 8000
top_solid_infill_acceleration = 2000
travel_acceleration = 10000
first_layer_acceleration = 500
bridge_acceleration = 3000
max_print_speed = 300
max_volumetric_speed = 18
