<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartão de Visita MAVI 3D PRINT</title>
<style>
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
  }

  :root {
    /* Paleta (a mesma família do MAVISKY) */
    --antracite: #15171A;
    --cobre: #C47A45;
    --cobre-claro: #E39A63;
    --branco: #F5F5F5;
    --cinza: #6B6F73;
    --texto-2: #B8BBC0;

    /* Formato: 85 x 55 mm + 3 mm de sangria */
    --w: 85mm;
    --h: 55mm;
    --bleed: 3mm;

    --page: #0A0B0C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--page);
    color: var(--branco);
    font-family: "Montserrat", system-ui, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ---------- Página de pré-visualização ---------- */
  .viewer {
    min-height: 100vh;
    padding: 32px 16px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .viewer h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--texto-2);
    text-align: center;
  }
  .viewer h1 b { color: var(--cobre); font-weight: 600; }
  .sheet { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .side figcaption { font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: var(--cinza); }
  @media (min-width: 760px)  { .sheet { zoom: 1.35; } }
  @media (min-width: 1280px) { .sheet { zoom: 1.6; } }

  /* ---------- Cartão ---------- */
  .card {
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    border-radius: 1.2mm;
    box-shadow: 0 10px 30px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
  }
  .bleed { position: absolute; inset: calc(var(--bleed) * -1); background: var(--antracite); }
  .trim { position: absolute; inset: var(--bleed); }

  /* textura: linhas de camada de impressão 3D */
  .camadas {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(255,255,255,.035) 0 .12mm, transparent .12mm .55mm);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(21,23,26,0) 30%, rgba(8,9,10,.8) 100%);
  }
  .brilho {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(196,122,69,.16), rgba(196,122,69,0) 45%);
  }

  /* Frente */
  .front .logo {
    position: absolute;
    height: 43mm;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }

  /* Verso */
  .back .logo {
    position: absolute;
    left: 5.5mm; top: 50%;
    height: 37mm;
    transform: translateY(-50%);
  }
  .back .divider {
    position: absolute;
    left: 40mm; top: 11mm; bottom: 11mm;
    width: .25mm;
    background: linear-gradient(to bottom, rgba(196,122,69,0), var(--cobre) 25%, var(--cobre) 75%, rgba(196,122,69,0));
  }
  .back .info {
    position: absolute;
    left: 44mm; right: 3.5mm; top: 50%;
    transform: translateY(-50%);
  }
  .name {
    font-size: 9.5pt; font-weight: 600; letter-spacing: .02em;
    color: var(--branco); line-height: 1.15; white-space: nowrap;
  }
  .role {
    margin-top: 1mm;
    font-size: 5pt; font-weight: 500; letter-spacing: .2em;
    text-transform: uppercase; color: var(--cobre); white-space: nowrap;
  }
  .contacts { list-style: none; margin-top: 4.2mm; display: grid; gap: 1.9mm; }
  .contacts li {
    display: flex; align-items: center; gap: 1.8mm;
    font-size: 6.6pt; font-weight: 400; color: var(--branco);
    white-space: nowrap; letter-spacing: .01em;
  }
  .contacts .c { color: var(--cobre-claro); font-weight: 500; }
  .contacts svg {
    flex: none; width: 2.6mm; height: 2.6mm;
    color: var(--cobre); stroke: var(--cobre); fill: none; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ---------- Impressão: uma página por face, 91 x 61 mm (com sangria) ---------- */
  @page { size: 91mm 61mm; margin: 0; }
  @media print {
    body { background: var(--antracite); }
    .viewer { display: block; padding: 0; min-height: 0; }
    .viewer h1, .side figcaption, .note { display: none; }
    .sheet { display: block; zoom: 1 !important; }
    .side { display: block; }
    .card {
      width: calc(var(--w) + 2 * var(--bleed));
      height: calc(var(--h) + 2 * var(--bleed));
      border-radius: 0; box-shadow: none;
      page-break-after: always; break-after: page;
    }
    .side:last-child .card { page-break-after: auto; break-after: auto; }
    .bleed { inset: 0; }
  }

  .note { max-width: 560px; font-size: 12px; line-height: 1.6; color: var(--cinza); text-align: center; }
</style>
</head>
<body>
<main class="viewer">
  <h1>Cartão de visita · <b>MAVI 3D PRINT</b></h1>

  <div class="sheet">
    <!-- FRENTE -->
    <figure class="side">
      <div class="card front">
        <div class="bleed">
          <div class="camadas"></div>
          <div class="brilho"></div>
          <div class="vignette"></div>
          <div class="trim">
            <img class="logo" src="assets/logo-mavi3dprint.svg" alt="MAVI 3D PRINT">
          </div>
        </div>
      </div>
      <figcaption>Frente</figcaption>
    </figure>

    <!-- VERSO -->
    <figure class="side">
      <div class="card back">
        <div class="bleed">
          <div class="camadas"></div>
          <div class="vignette"></div>
          <div class="trim">
            <img class="logo" src="assets/logo-mavi3dprint.svg" alt="MAVI 3D PRINT">
            <div class="divider"></div>

            <div class="info">
              <!-- EDITAR: nome e função -->
              <div class="name">Mauro Dinis</div>
              <div class="role">Impressão 3D</div>

              <ul class="contacts">
                <!-- EDITAR: telefone -->
                <li>
                  <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
                  +351 920 065 394
                </li>
                <!-- EDITAR: site (o troço em .c sai a cobre) -->
                <li>
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5a14.5 14.5 0 0 1 0 19M12 2.5a14.5 14.5 0 0 0 0 19"/></svg>
                  <span>www.mavi<span class="c">3dprint</span>.pt</span>
                </li>
              </ul>
            </div>

          </div>
        </div>
      </div>
      <figcaption>Verso</figcaption>
    </figure>
  </div>

  <p class="note">85 × 55 mm · frente e verso</p>
</main>
</body>
</html>
