<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartão de Visita MAVISKY</title>
<style>
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
  }

  :root {
    /* Paleta da marca */
    --antracite: #15171A;
    --cobre: #C47A45;
    --branco: #F5F5F5;
    --cinza: #6B6F73;
    --texto-2: #B8BBC0;

    /* Formato: 85 x 55 mm + 3 mm de sangria */
    --w: 85mm;
    --h: 55mm;
    --bleed: 3mm;

    --page: #0A0B0C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--page);
    color: var(--branco);
    font-family: "Montserrat", system-ui, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ---------- Página de pré-visualização ---------- */
  .viewer {
    min-height: 100vh;
    padding: 32px 16px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .viewer h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--texto-2);
    text-align: center;
  }
  .viewer h1 b { color: var(--cobre); font-weight: 600; }
  .sheet {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px;
  }
  .side { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .side figcaption {
    font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: var(--cinza);
  }
  @media (min-width: 760px)  { .sheet { zoom: 1.35; } }
  @media (min-width: 1280px) { .sheet { zoom: 1.6; } }

  /* ---------- Cartão ---------- */
  .card {
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    border-radius: 1.2mm;
    box-shadow: 0 10px 30px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
  }
  /* Área com sangria: no ecrã fica cortada pelo cartão, na impressão é a página */
  .bleed {
    position: absolute;
    inset: calc(var(--bleed) * -1);
    background: var(--antracite);
  }
  /* Área final (corte) dentro da sangria */
  .trim {
    position: absolute;
    inset: var(--bleed);
  }

  .topo {
    position: absolute; inset: 0;
    background: url("assets/topografia.svg") center / cover no-repeat;
    opacity: .13;
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(21,23,26,0) 35%, rgba(8,9,10,.75) 100%);
  }

  /* Frente */
  .front .logo {
    position: absolute;
    width: 47mm; height: 47mm;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }

  /* Verso */
  .back .topo { opacity: .10; background-position: 70% 60%; }
  .back .logo {
    position: absolute;
    left: 5mm; top: 50%;
    width: 32.5mm;
    transform: translateY(-50%);
  }
  .back .divider {
    position: absolute;
    left: 42mm; top: 12.5mm; bottom: 12.5mm;
    width: .25mm;
    background: linear-gradient(to bottom, rgba(196,122,69,0), var(--cobre) 25%, var(--cobre) 75%, rgba(196,122,69,0));
  }
  .back .info {
    position: absolute;
    left: 46mm; right: 4mm; top: 50%;
    transform: translateY(-50%);
  }
  .name {
    font-size: 9.5pt;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--branco);
    line-height: 1.15;
    white-space: nowrap;
  }
  .role {
    margin-top: 1mm;
    font-size: 5pt;
    font-weight: 500;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--cobre);
    white-space: nowrap;
  }
  .contacts {
    list-style: none;
    margin-top: 4.2mm;
    display: grid;
    gap: 1.7mm;
  }
  .contacts li {
    display: flex; align-items: center; gap: 1.8mm;
    font-size: 6.6pt;
    font-weight: 400;
    color: var(--branco);
    white-space: nowrap;
    letter-spacing: .01em;
  }
  .contacts svg {
    flex: none;
    width: 2.6mm; height: 2.6mm;
    color: var(--cobre); stroke: var(--cobre); fill: none; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .back .slogan {
    position: absolute;
    right: 4mm; bottom: 3.6mm;
    font-size: 4.3pt;
    letter-spacing: .3em;
    color: #8A8E93;
    text-transform: uppercase;
  }

  /* ---------- Impressão: uma página por face, 91 x 61 mm (com sangria) ---------- */
  @page { size: 91mm 61mm; margin: 0; }
  @media print {
    body { background: var(--antracite); }
    .viewer { display: block; padding: 0; min-height: 0; }
    .viewer h1, .side figcaption, .note { display: none; }
    .sheet { display: block; zoom: 1 !important; }
    .side { display: block; }
    .card {
      width: calc(var(--w) + 2 * var(--bleed));
      height: calc(var(--h) + 2 * var(--bleed));
      border-radius: 0;
      box-shadow: none;
      page-break-after: always;
      break-after: page;
    }
    .side:last-child .card { page-break-after: auto; break-after: auto; }
    .bleed { inset: 0; }
  }

  .note {
    max-width: 560px;
    font-size: 12px; line-height: 1.6; color: var(--cinza); text-align: center;
  }
</style>
</head>
<body>
<main class="viewer">
  <h1>Cartão de visita · <b>MAVISKY</b></h1>

  <div class="sheet">
    <!-- FRENTE -->
    <figure class="side">
      <div class="card front">
        <div class="bleed">
          <div class="topo"></div>
          <div class="vignette"></div>
          <div class="trim">
            <img class="logo" src="assets/logo-circular.png" alt="MAVISKY — Filmagens Aéreas & FPV">
          </div>
        </div>
      </div>
      <figcaption>Frente</figcaption>
    </figure>

    <!-- VERSO -->
    <figure class="side">
      <div class="card back">
        <div class="bleed">
          <div class="topo"></div>
          <div class="trim">
            <img class="logo" src="assets/logo-empilhado.png" alt="MAVISKY">
            <div class="divider"></div>

            <div class="info">
              <!-- EDITAR: nome e função -->
              <div class="name">Nome Apelido</div>
              <div class="role">Piloto de Drone · FPV</div>

              <ul class="contacts">
                <!-- EDITAR: telefone -->
                <li>
                  <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
                  +351 9XX XXX XXX
                </li>
                <!-- EDITAR: email -->
                <li>
                  <svg viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
                  geral@mavisky.pt
                </li>
                <!-- EDITAR: site -->
                <li>
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5a14.5 14.5 0 0 1 0 19M12 2.5a14.5 14.5 0 0 0 0 19"/></svg>
                  www.mavisky.pt
                </li>
                <!-- EDITAR: Instagram -->
                <li>
                  <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r=".6" fill="currentColor"/></svg>
                  @mavisky
                </li>
              </ul>
            </div>

            <div class="slogan">Imagens que vão mais longe</div>
          </div>
        </div>
      </div>
      <figcaption>Verso</figcaption>
    </figure>
  </div>

  <p class="note">85 × 55 mm. Contactos são exemplos — substituir antes de imprimir.</p>
</main>
</body>
</html>
